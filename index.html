<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Translator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Emoji Translator</h1>

  <!-- Input -->
  <textarea id="textInput" placeholder="Type your sentence here..."></textarea>
  <button id="translateBtn">➡️ Translate to Emoji</button>

  <!-- Output -->
  <div id="emojiOutput"></div>

  <!-- Actions -->
  <div class="actions">
    <button id="copyBtn">📋 Copy</button>
    <button id="clearBtn">🗑 Clear</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
