<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Story Builder</h1>
    <div id="storyArea"></div>

    <div class="buttons">
      <button id="randomBtn">Random Sentence</button>
      <button id="writeBtn">Write Your Own</button>
      <button id="wordBtn">Include Random Word</button>
    </div>
    
    <div id="inputArea" class="hidden">
      <input type="text" id="userInput" placeholder="Type your sentence...">
      <button id="submitBtn">Add Sentence</button>
    </div>

    <button id="resetBtn">Start Over</button>
  </div>

<script src="script.js"></script>
</body>
</html>
